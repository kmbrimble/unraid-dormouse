name: Release

# This repository is a READ-ONLY MIRROR of the primary repo on a private forge (Gitea). Never push here directly:
# the mirror force-syncs from the primary and would discard anything that exists only on GitHub.
#
# A release is a v* tag pushed to the primary and mirrored here. This workflow then rebuilds the package from
# the tagged source (the build is deterministic), requires the committed .plg &md5; to equal the rebuilt md5,
# and publishes the GitHub Release with the .txz attached. It does NOT commit, push or tag anything.
#
# workflow_dispatch is a dry run: it builds and prints the md5 and publishes nothing, so the build can be
# compared with the primary's CI without cutting a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Work out the version
        run: |
          set -euo pipefail
          PLG_VERSION=$(sed -rn 's|^<!ENTITY version[[:space:]]+"([^"]+)">.*|\1|p' dormouse.plg)
          [ -n "$PLG_VERSION" ] || { echo "::error::could not read &version; from dormouse.plg"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            VERSION="$PLG_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$VERSION" = "$PLG_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match dormouse.plg &version; $PLG_VERSION"; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Require a CHANGES entry for this version
        run: grep -qx "###$VERSION" dormouse.plg

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: "8.4"
          extensions: json, sqlite3, pcntl, posix

      - name: Version-sort guard (strcmp, matching dynamix.plugin.manager)
        run: |
          PREV_TAG=$(git tag --list 'v*' | grep -vx "v$VERSION" | sort -V | tail -n1 || true)
          if [[ -n "$PREV_TAG" ]]; then
            php scripts/version-sorts-after.php "${PREV_TAG#v}" "$VERSION"
          fi

      - name: Lint
        run: |
          find plugin scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l plugin/scripts/dormoused

      - name: Test
        run: php tests/run.php

      - name: Dry run - report the md5 of this build
        if: env.DRY_RUN == 'true'
        run: bash scripts/check-md5.sh "$VERSION" --report-only

      - name: Rebuild and require the committed md5 to match
        if: env.DRY_RUN != 'true'
        run: bash scripts/check-md5.sh "$VERSION"

      - name: Publish the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            exit 0
          fi
          gh release create "v$VERSION" "dist/dormouse-$VERSION.txz" \
            --title "v$VERSION" \
            --notes "See CHANGELOG.md"
